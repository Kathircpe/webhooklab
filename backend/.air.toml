root = "."
tmp_dir = "tmp"
[build]
  cmd = "go build -o ./tmp/main ./cmd/server"
  bin = "./tmp/main"
  delay = 1000
  exclude_dir = ["tmp", "vendor", "node_modules"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  kill_delay = "0s"
[log]
  time = true
[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"
